model:
  backbone: "facebook/dinov2-small" # Efficient DINOv2 / DINOv3 backbone via torchvision/timm/transformers
  freeze_backbone: true
  image_size: 224
  embedding_dim: 384
  quality_feature_dim: 24
  fusion_dim: 256
  num_classes: 4 # Grade A, B, C, D

training:
  epochs: 25
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 5
  seed: 42
  device: "cuda" # Automatically falls back to cpu if cuda unavailable

optimizer:
  name: "AdamW"

scheduler:
  name: "cosine"
  min_lr: 1.0e-6

mixed_precision: true

dataset:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  data_dir: "data"
